[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "disconnect"
description = "Tracker classification against the Disconnect services list"
readme = "README.md"
requires-python = ">=3.9"
# Kept in the Makefile, which the DuckDB extension build also reads it from.
dynamic = ["version"]
classifiers = [
    # The embedded list is CC BY-NC-SA 4.0 (see the README): the wheel carries a
    # non-commercial restriction, so it is not for a public index.
    "Private :: Do Not Upload",
]

[tool.setuptools]
# A single C extension module, so there is nothing for setuptools to discover.
packages = []
py-modules = []
