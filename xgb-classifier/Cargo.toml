[package]
name = "xgb_classifier"
version = "0.1.0"
edition = "2021"

[lib]
name = "xgb_classifier"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }

[profile.release]
# Strip symbols, as `llm-classifier-python` and `llm-classifier-baseline` do, so the
# size this crate reports is comparable with theirs. It is the comparison this
# crate exists to make: see the header of src/lib.rs.
strip = true

# The generated `trees.rs` is ~13 MB of nested `if` in 370 functions. At
# opt-level 3 rustc spends minutes on it for no measurable gain -- the tree
# walk is branch-bound, not something the optimiser improves -- so the release
# profile drops to 1. `scripts/build_model.py` prints the build time it saw.
opt-level = 1
